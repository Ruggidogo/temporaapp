<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#faviconGradient)"/>
  
  <!-- Hour Hand -->
  <line x1="256" y1="256" x2="256" y2="100" stroke="white" stroke-width="36" stroke-linecap="round"/>
  
  <!-- Minute Hand -->
  <line x1="256" y1="256" x2="380" y2="180" stroke="white" stroke-opacity="0.85" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Center Dot -->
  <circle cx="256" cy="256" r="28" fill="white"/>
</svg>
